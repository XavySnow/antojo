options:
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
serviceAccount: projects/antojo-lab/serviceAccounts/antojo-cloud-build@antojo-lab.iam.gserviceaccount.com
timeout: 1800s
