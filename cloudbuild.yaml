# Temporary CI bridge: remote builds avoid eleven local toolchains on a Mac.
# Triggered builds inherit SHORT_SHA; manual submits must supply _TAG=<git-sha>.
# Each build-and-push step waits only for validation, enabling parallel execution.
# Partial failures can leave pushed images; deployment waits for the whole build.
steps:
- id: validate
  name: gcr.io/cloud-builders/docker
  entrypoint: bash
  env:
  - IMAGE_TAG=${_TAG}
  args:
  - -ceu
  - |
    if [[ ! "$$IMAGE_TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
      echo 'Set _TAG to a Git commit SHA (7-40 hex characters); manual builds must supply it.' >&2
      exit 1
    fi
    for context in services/frontend services/productcatalogservice services/cartservice/src services/currencyservice services/paymentservice services/shippingservice services/emailservice services/checkoutservice services/recommendationservice services/adservice services/loadgenerator; do
      test -f "$$context/Dockerfile"
    done
- id: build-frontend
  name: gcr.io/cloud-builders/docker
  waitFor:
  - validate
  entrypoint: bash
  env:
  - IMAGE=us-central1-docker.pkg.dev/antojo-lab/antojo/frontend:${_TAG}
  args:
  - -ceu
  - |
    docker build --platform=linux/amd64 --tag "$$IMAGE" services/frontend
    docker push "$$IMAGE"
- id: build-productcatalogservice
  name: gcr.io/cloud-builders/docker
