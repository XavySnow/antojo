{{- if and .Values.frontend.externalService .Values.frontend.gateway.enabled }}
{{- fail "Choose LoadBalancer OR Gateway: set frontend.externalService=false for Gateway" }}
{{- end }}
{{- if .Values.services.frontend.enabled }}
{{- if .Values.frontend.externalService }}
apiVersion: v1
kind: Service
metadata:
  name: frontend-external
  labels:
    {{- include "antojo.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    app: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- end }}
{{- if .Values.frontend.gateway.enabled }}
# Requires the GKE Gateway controller and CRDs. HTTP only in this bridge.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: antojo
  labels:
    {{- include "antojo.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.frontend.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: antojo
  labels:
    {{- include "antojo.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: antojo
      sectionName: http
  {{- if .Values.frontend.gateway.hostname }}
  hostnames:
    - {{ .Values.frontend.gateway.hostname | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
{{- end }}
{{- end }}
