{{- range $name := list "frontend" "checkoutservice" "cartservice" }}
{{- $service := index $.Values.services $name }}
{{- if $service.enabled }}
{{- if lt (int $service.replicas) 2 }}
{{- fail (printf "%s needs at least 2 replicas for its minAvailable=1 PDB" $name) }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "antojo.labels" $ | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
{{- end }}
{{- end }}
