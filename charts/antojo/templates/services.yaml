{{- range $name, $service := .Values.services }}
{{- if and $service.enabled $service.servicePort }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "antojo.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: {{ $service.health }}
      port: {{ $service.servicePort }}
      targetPort: {{ $service.port }}
{{- end }}
{{- end }}
