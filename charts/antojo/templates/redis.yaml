# Modified by the Antojo project, 2026: simplified and hardened lab packaging.

# Disposable lab cache; never store real orders here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-cart
  labels:
    {{- include "antojo.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  labels:
    {{- include "antojo.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Do not put two independent Redis stores behind one Service during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-cart
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: redis-cart
        {{- include "antojo.labels" . | nindent 8 }}
    spec:
      serviceAccountName: redis-cart
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ printf "%s:%s" .Values.redis.image.repository .Values.redis.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          command: [redis-server]
          args: ["--save", "", "--appendonly", "no", "--maxmemory", {{ .Values.redis.maxmemory | quote }}, "--maxmemory-policy", "allkeys-lru"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: redis
              containerPort: 6379
          startupProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  labels:
    {{- include "antojo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: redis-cart
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
