  adservice:
    enabled: true
    replicas: 1
    image:
      tag: ''
    port: 9555
    servicePort: 9555
    health: grpc
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 100Mi
      limits:
        cpu: '1'
        memory: 1536Mi
        ephemeral-storage: 1Gi
    env:
      PORT: '9555'
      DISABLE_TRACING: '1'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0 -Djava.io.tmpdir=/tmp
  loadgenerator:
    enabled: false
    replicas: 1
    image:
      tag: ''
    port: 0
    servicePort: 0
